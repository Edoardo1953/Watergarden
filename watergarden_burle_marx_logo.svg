<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFB" />
      <stop offset="100%" stop-color="#F6F7F5" />
    </linearGradient>

    <!-- Deep Maritime Navy -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162D4A" />
      <stop offset="100%" stop-color="#0E1B2D" />
    </linearGradient>

    <!-- Forest Emerald Green -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#124838" />
      <stop offset="100%" stop-color="#1C6650" />
    </linearGradient>

    <!-- Brushed Champagne Gold -->
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BA8E3F" />
      <stop offset="50%" stop-color="#DDC17E" />
      <stop offset="100%" stop-color="#A97E33" />
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0E1B2D" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad2)" />

  <!-- Monogram Mark Group (Centered around X=425, Y=220) -->
  <g transform="translate(425, 215)" filter="url(#softShadow2)">
    
    <!-- LEFT 'W' SECTION: Sinuous modernist waves in Green & Navy with Gold highlight -->
    <!-- W Outer Left Wave (Navy) -->
    <path d="M-140 -90 C-130 -40 -115 10 -95 60 C-85 45 -70 -15 -60 -60 C-75 -65 -110 -75 -140 -90 Z" 
          fill="url(#navyGrad)" />

    <!-- W Middle Ribbon (Green) -->
    <path d="M-120 -80 C-110 -30 -90 25 -70 70 C-50 20 -30 -35 -15 -80 C-30 -80 -45 -40 -60 -5 C-75 -40 -95 -75 -120 -80 Z" 
          fill="url(#greenGrad)" />

    <!-- W Accent Ridge (Gold) -->
    <path d="M-135 -95 C-125 -90 -105 -82 -95 -80 C-80 -40 -60 15 -45 55 C-55 45 -65 25 -75 -5 C-90 -45 -110 -80 -135 -95 Z" 
          fill="url(#goldGrad2)" />

    <!-- Central S-Curve Transition: Fluid wave connecting W into G -->
    <path d="M-45 55 C-25 90 10 95 40 60 C20 60 5 45 -10 15 C-25 -20 -15 -65 10 -85 C-5 -75 -25 -25 -45 55 Z" 
          fill="url(#navyGrad)" />

    <!-- RIGHT 'G' SECTION: Cleaned & Streamlined (No inner blue stripe) -->
    <!-- G Main Outer Ribbon Arch (Forest Green) -->
    <path d="M25 -80 C75 -95 135 -65 145 5 C150 45 135 85 95 95 C65 102 30 90 20 65 C45 78 85 80 110 55 C130 30 130 -30 90 -65 C65 -80 40 -78 25 -80 Z" 
          fill="url(#greenGrad)" />

    <!-- G Bold Golden Primary Form & Crossbar (Pure Clean Gold) -->
    <path d="M15 -60 C55 -75 110 -50 115 5 C118 40 95 65 65 65 C45 65 35 55 35 40 L115 40 L115 20 L55 20 C60 -10 85 -35 100 -40 C75 -55 40 -45 15 -60 Z" 
          fill="url(#goldGrad2)" />

    <!-- G Interior Lower Swell (Warm Gold Extension, clean and unified) -->
    <path d="M50 40 L115 40 C110 65 85 75 60 70 C45 68 40 55 50 40 Z" 
          fill="url(#goldGrad2)" />

  </g>

  <!-- Typography Section -->
  <!-- WATERGARDEN -->
  <text x="425" y="475" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#0E1B2D" 
        text-anchor="middle">
    WATERGARDEN
  </text>

  <!-- Accent Rule with Diamond -->
  <line x1="335" y1="505" x2="515" y2="505" stroke="#DFC07B" stroke-width="1.6" stroke-linecap="round" />
  <rect x="421" y="501" width="8" height="8" transform="rotate(45 425 505)" fill="#124838" stroke="#DFC07B" stroke-width="1.2" />

  <!-- MANAGEMENT -->
  <text x="425" y="540" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="12" 
        fill="#124838" 
        text-anchor="middle">
    MANAGEMENT
  </text>

  <!-- Subtitle -->
  <text x="425" y="580" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#82949B" 
        text-anchor="middle">
    INVESTMENT &amp; GOVERNANCE • BRASIL
  </text>
</svg>
