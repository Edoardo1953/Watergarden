<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (subtle off-white) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFDFD" />
      <stop offset="100%" stop-color="#F7FAF9" />
    </linearGradient>

    <!-- Forest & Emerald Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144638" />
      <stop offset="100%" stop-color="#23745B" />
    </linearGradient>
    
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194F5E" />
      <stop offset="100%" stop-color="#11333E" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4E" />
      <stop offset="50%" stop-color="#DFC07B" />
      <stop offset="100%" stop-color="#B88A3A" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#11333E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <g transform="translate(400, 205)" filter="url(#subtleShadow)">
    <!-- Base Outer Circular Garden Silhouette -->
    <!-- Gold accent back-leaf / solar arc -->
    <path d="M-45 -70 C-10 -115 50 -105 85 -55 C65 -25 35 -15 15 -25 C-10 -35 -30 -50 -45 -70 Z" 
          fill="url(#goldGrad)" opacity="0.9" />

    <!-- Left Outer Leaf / Canopy -->
    <path d="M-105 -15 C-125 -65 -80 -120 -5 -145 C-15 -90 -45 -50 -85 -25 C-95 -20 -100 -18 -105 -15 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Right Outer Canopy Shield -->
    <path d="M10 -145 C80 -125 130 -60 115 15 C85 -5 60 -45 5 -105 C5 -120 7 -135 10 -145 Z" 
          fill="url(#tealGrad)" />

    <!-- Water Stream 1 (Bottom Left Sweep) -->
    <path d="M-125 45 C-115 110 -25 155 45 135 C15 150 -55 135 -95 95 C-115 75 -122 60 -125 45 Z" 
          fill="url(#tealGrad)" />

    <!-- Water Stream 2 (Concentric Inner Flow) -->
    <path d="M-105 55 C-80 115 15 130 85 95 C95 90 110 70 115 45 C100 70 70 95 10 100 C-50 105 -90 85 -105 55 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Bottom Golden Ripple Accent -->
    <path d="M-25 125 C15 135 65 115 95 80 C85 95 45 118 0 112 C-15 110 -20 115 -25 125 Z" 
          fill="url(#goldGrad)" />

    <!-- Central Sprout / Twin Living Leaves (The Controlled Companies / Growth) -->
    <!-- Left Leaf -->
    <path d="M-8 40 C-45 15 -70 -35 -40 -75 C-15 -40 -5 -5 0 25 C-3 30 -5 35 -8 40 Z" 
          fill="url(#tealGrad)" />
    
    <!-- Right Leaf -->
    <path d="M0 25 C10 -10 30 -55 65 -70 C65 -30 40 15 5 45 C3 38 1 32 0 25 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Central Core Sprout Stem & Bud -->
    <path d="M-6 42 C-4 15 0 -25 0 -45 C5 -25 8 15 6 42 C2 44 -2 44 -6 42 Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Typography Section -->
  <!-- WATERGARDEN -->
  <text x="400" y="475" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#11333E" 
        text-anchor="middle">
    WATERGARDEN
  </text>

  <!-- Divider Line with Gold Node -->
  <line x1="310" y1="505" x2="490" y2="505" stroke="#DFC07B" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="400" cy="505" r="3.5" fill="#144638" stroke="#DFC07B" stroke-width="1.5" />

  <!-- MANAGEMENT -->
  <text x="400" y="540" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="12" 
        fill="#1E6B52" 
        text-anchor="middle">
    MANAGEMENT
  </text>

  <!-- Subtitle Tagline (Optional / Minimal) -->
  <text x="400" y="580" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#7A938F" 
        text-anchor="middle">
    EQUITY &amp; PARTICIPATION • BRASIL
  </text>
</svg>
